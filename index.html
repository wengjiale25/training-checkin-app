<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f9f8f" />
    <meta
      name="description"
      content="六课三分化循环、力量后有氧与游泳记录的手机训练打卡工具。"
    />
    <title>训练打卡</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=10" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">训</span>
          <div>
            <p class="eyebrow" id="weekLabel">本周计划</p>
            <h1>训练打卡</h1>
          </div>
        </div>
        <button class="install-button" id="installBtn" type="button" hidden>安装</button>
      </header>

      <section class="progress-panel" id="progressPanel">
        <div class="progress-copy">
          <p id="selectedDateLabel">今天</p>
          <h2 id="dayTitle">加载中</h2>
          <div class="progress-number">
            <strong id="progressPercent">0%</strong>
            <span id="progressText">0 / 0组</span>
          </div>
        </div>
        <div class="progress-track" aria-label="当天完成进度">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </section>

      <section class="week-control" aria-label="周计划日期">
        <div class="week-switcher">
          <button class="week-arrow" type="button" data-action="prev-week" aria-label="上一周">←</button>
          <span>选择日期</span>
          <button class="week-arrow" type="button" data-action="next-week" aria-label="下一周">→</button>
        </div>
        <div class="day-strip" id="dayStrip"></div>
      </section>

      <section class="view" id="todayView">
        <div class="plan-meta" id="planMeta"></div>
        <div class="exercise-list" id="exerciseList"></div>
        <div class="conditioning-area" id="conditioningArea"></div>
        <div id="completionCard"></div>
        <div class="journal-area" id="journalArea"></div>
      </section>

      <section class="view" id="weekView" hidden>
        <div class="week-plan-list" id="weekPlanList"></div>
      </section>

      <section class="view" id="historyView" hidden>
        <div class="history-summary" id="historySummary"></div>
        <div class="history-list" id="historyList"></div>
      </section>

      <section class="view" id="weightsView" hidden>
        <header class="weights-header">
          <div>
            <p>动作数据库</p>
            <h2>常用重量</h2>
          </div>
          <span id="weightsStatus">自动保存</span>
        </header>
        <div class="weight-filters" id="weightFilters" aria-label="动作部位筛选"></div>
        <div class="weights-list" id="weightsList"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <span class="nav-indicator" aria-hidden="true"></span>
      <button class="nav-item active" type="button" data-view="today">
        <span class="nav-icon" aria-hidden="true">✓</span>
        今日
      </button>
      <button class="nav-item" type="button" data-view="week">
        <span class="nav-icon" aria-hidden="true">周</span>
        循环
      </button>
      <button class="nav-item" type="button" data-view="weights">
        <span class="nav-icon" aria-hidden="true">磅</span>
        重量
      </button>
      <button class="nav-item" type="button" data-view="history">
        <span class="nav-icon" aria-hidden="true">时</span>
        历史
      </button>
    </nav>

    <aside class="rest-timer" id="restTimer" hidden aria-live="polite"></aside>

    <div class="sheet-layer" id="recordSheet" hidden>
      <button class="sheet-backdrop" type="button" data-action="close-record" aria-label="关闭记录"></button>
      <section class="record-sheet" role="dialog" aria-modal="true" aria-labelledby="recordSheetTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div id="recordSheetContent"></div>
      </section>
    </div>

    <div class="sheet-layer guide-layer" id="guideSheet" hidden>
      <button class="sheet-backdrop" type="button" data-action="close-guide" aria-label="关闭动作教学"></button>
      <section class="record-sheet guide-sheet" role="dialog" aria-modal="true" aria-labelledby="guideSheetTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div id="guideSheetContent"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      window.APP_V3 = true;
    </script>
    <script src="./app.js?v=10"></script>
    <script src="./guides.js?v=10"></script>
    <script src="./experience.js?v=10"></script>
  </body>
</html>
